<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#151514" />
    <script>
      (function () {
        var theme = "dark";
        try { if (localStorage.getItem("jimvis_theme") === "light") theme = "light"; } catch (e) {}
        document.documentElement.dataset.theme = theme;
        if (theme === "light") {
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute("content", "#f6f6f4");
        }
      })();
    </script>
    <meta name="description" content="Project Jimvis turns plain-English business questions into decision-ready reports with Jim, your AI business analyst." />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/icons/jimvis-192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <script>
      (function () {
        var redirect = sessionStorage.getItem("jimvis_spa_redirect");
        if (redirect) {
          sessionStorage.removeItem("jimvis_spa_redirect");
          history.replaceState(null, "", redirect);
        }
      })();
    </script>
    <script src="/registerSW.js" defer></script>
    <title>Project Jimvis — Business clarity with character</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
